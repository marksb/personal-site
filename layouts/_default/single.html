{{ define "main" }}
  <article>
    <header class="mb-8">
      <h1 class="text-2xl font-semibold">{{ .Title }}</h1>
      {{ if eq .Section "posts" }}
        <time datetime="{{ .Date.Format "2006-01-02" }}" class="mt-1 block text-sm text-neutral-500 dark:text-neutral-500">
          {{ .Date.Format "January 2, 2006" }}
        </time>
      {{ end }}
    </header>

    <div class="prose prose-neutral max-w-none dark:prose-invert prose-a:break-words">
      {{ .Content }}
    </div>

    {{ if eq .Section "posts" }}
      {{ with .GetTerms "tags" }}
        <ul class="mt-10 flex flex-wrap gap-2 text-sm">
          {{ range . }}
            <li>
              <a href="{{ .Permalink }}" class="rounded border border-neutral-300 px-2 py-0.5 no-underline text-neutral-600 hover:border-neutral-900 hover:text-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:hover:border-neutral-100 dark:hover:text-neutral-100">
                {{ .LinkTitle }}
              </a>
            </li>
          {{ end }}
        </ul>
      {{ end }}
    {{ end }}
  </article>
{{ end }}
